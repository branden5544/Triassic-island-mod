modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Eli"
description='''
Dinosaurs meet the 21st century. Dig up fossils, clone dinosaurs, and run a park
powered by a realistic electrical grid, Python computers, and security cameras.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional integrations - Triassic Island works without these, but hooks into them when present.
[[dependencies.${mod_id}]]
    modId="immersiveengineering"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="immersivepetroleum"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mts"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="immersiverailroading"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
